<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velona — Baby Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">V</span>
      <span>velona</span>
    </a>
    <nav class="nav-links">
      <a href="#">Baby</a>
      <a href="#">Sanitary</a>
      <a href="#">Clothing</a>
      <a href="#">Offers</a>
    </nav>
    <button class="cart-btn" onclick="openCart()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<!-- ============ HERO ============ -->
<section class="hero">
  <div class="hero-content">
    <h1>Everything your little one needs</h1>
    <p>Gentle, safe & loved by parents across Sri Lanka.</p>
  </div>
</section>

<!-- ============ PRODUCTS ============ -->
<section class="products">
  <div class="section-head">
    <h2>Our Products</h2>
    <p>Handpicked for comfort & care</p>
  </div>

  <div class="product-grid" id="productGrid">
    <!-- Products loaded by JS -->
  </div>
</section>

<!-- ============ CART DRAWER ============ -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <h3>Your Cart</h3>
    <button onclick="closeCart()" class="close-cart">✕</button>
  </div>

  <div class="cart-items" id="cartItems">
    <p class="empty-cart">Your cart is empty 🛒</p>
  </div>

  <div class="cart-foot">
    <div class="cart-total">
      <span>Total</span>
      <strong id="cartTotal">Rs. 0.00</strong>
    </div>
    <button class="checkout-btn" id="checkoutBtn" onclick="goToCheckout()" disabled>
      Proceed to Checkout →
    </button>
  </div>
</aside>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast">Added to cart ✓</div>

<script src="script.js"></script>
</body>
</html>
