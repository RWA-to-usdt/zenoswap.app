<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenoSwap — Modern Tech Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">Z</span>
      <span>zenoswap</span>
    </a>
    <nav class="nav-links">
      <a href="#">Audio</a>
      <a href="#">Wearables</a>
      <a href="#">Accessories</a>
      <a href="#">Deals</a>
      <a href="index.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="returns.html">Returns</a>
    </nav>
    <button class="cart-btn" onclick="openCart()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Upgrade your everyday tech</h1>
    <p>Premium gadgets, honest prices — shipped worldwide.</p>
  </div>
</section>

<section class="products">
  <div class="section-head">
    <h2>Featured Products</h2>
    <p>Handpicked tech for modern living</p>
  </div>
  <div class="product-grid" id="productGrid"></div>
</section>

<!-- CART DRAWER -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <h3>Your Cart</h3>
    <button onclick="closeCart()" class="close-cart">✕</button>
  </div>
  <div class="cart-items" id="cartItems">
    <p class="empty-cart">Your cart is empty 🛒</p>
  </div>
  <div class="cart-foot">
    <div class="cart-total">
      <span>Total</span>
      <strong id="cartTotal">$0.00</strong>
    </div>
    <button class="checkout-btn" id="checkoutBtn" onclick="goToCheckout()" disabled>
      Proceed to Checkout →
    </button>
  </div>
</aside>

<div class="toast" id="toast">Added to cart ✓</div>

<!-- ළඟම </body> එකට උඩින් -->
<footer class="site-footer">
  <!-- footer code එක -->
</footer>


<script src="script.js"></script>
</body>
</html>
